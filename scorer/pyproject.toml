[project]
name = "drift-scorer"
version = "0.1.0"
description = "drift's scoring service: rule engine, verdicts and explanations"
requires-python = ">=3.12"
dependencies = ["drift-gen", "grpcio>=1.85.0"]

[tool.uv.sources]
drift-gen = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_scorer"]
