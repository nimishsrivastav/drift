[project]
name = "drift-gen"
version = "0.1.0"
description = "Python stubs generated from proto/drift/v1"
requires-python = ">=3.12"
dependencies = ["grpcio>=1.85.0", "protobuf>=7.36.2,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift"]
