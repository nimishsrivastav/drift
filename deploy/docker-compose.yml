name: drift

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  networks: [drift-internal]

services:
  orchestrator:
    <<: *hardening
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    # The only service with a route out. It downloads and never runs package code.
    networks: [drift-internal, drift-egress]
    tmpfs: [/tmp]
    volumes:
      - artifacts:/artifacts
      # Separate from artifacts, so that analyzers never see the job database.
      - state:/var/lib/drift
    depends_on: [meta-go, static-rs, trace-rs, scorer]

  meta-go:
    <<: *hardening
    build:
      context: ..
      dockerfile: analyzers/meta-go/Dockerfile
    volumes:
      - artifacts:/artifacts:ro

  static-rs:
    <<: *hardening
    build:
      context: ..
      dockerfile: crates/static-rs/Dockerfile
    volumes:
      - artifacts:/artifacts:ro

  trace-rs:
    <<: *hardening
    build:
      context: ..
      dockerfile: crates/trace-rs/Dockerfile
    volumes:
      - artifacts:/artifacts:ro

  scorer:
    <<: *hardening
    build:
      context: ..
      dockerfile: scorer/Dockerfile

networks:
  # No route out and no published ports. Analyzers and the scorer are only on this one.
  drift-internal:
    internal: true
  # Registry and forge access for the orchestrator.
  drift-egress:

volumes:
  artifacts:
  state:
