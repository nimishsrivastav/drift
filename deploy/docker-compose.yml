name: drift

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  networks: [drift-internal]

services:
  orchestrator:
    <<: *hardening
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    # The only service with a route out. It downloads and never runs package code.
    networks: [drift-internal, drift-egress]
    tmpfs: [/tmp]
    volumes:
      - artifacts:/artifacts
      # Separate from artifacts, so that analyzers never see the job database.
      - state:/var/lib/drift
    depends_on: [meta-go, static-rs, trace-rs, scorer]

  meta-go:
    <<: *hardening
    build:
      context: ..
      dockerfile: analyzers/meta-go/Dockerfile
    volumes:
      - artifacts:/artifacts:ro

  static-rs:
    <<: *hardening
    build:
      context: ..
      dockerfile: crates/static-rs/Dockerfile
    environment:
      DRIFT_ARTIFACTS_ROOT: /artifacts
      DRIFT_TMP_DIR: /tmp
      DRIFT_MAX_CONCURRENT: "2"
    # Each analysis unpacks two versions here, at most 512 MiB each, and two run at once:
    # 2 GiB at worst, plus room for directory overhead. tmpfs only uses memory it fills.
    tmpfs: ["/tmp:size=2304m,mode=1777"]
    volumes:
      - artifacts:/artifacts:ro

  trace-rs:
    <<: *hardening
    build:
      context: ..
      dockerfile: crates/trace-rs/Dockerfile
    volumes:
      - artifacts:/artifacts:ro

  # Serves the synthetic fixtures as an npm registry for `just demo-fixture`. Off by default.
  fixture-registry:
    <<: *hardening
    profiles: [fixtures]
    build:
      context: ..
      dockerfile: deploy/fixture-registry/Dockerfile
    environment:
      FIXTURES_DIR: /fixtures/npm
      BASE_URL: http://fixture-registry:8080
    volumes:
      - ../fixtures:/fixtures:ro

  scorer:
    <<: *hardening
    build:
      context: ..
      dockerfile: scorer/Dockerfile

networks:
  # No route out and no published ports. Analyzers and the scorer are only on this one.
  drift-internal:
    internal: true
  # Registry and forge access for the orchestrator.
  drift-egress:

volumes:
  artifacts:
  state:
