# Real malicious updates of legitimate packages, each paired with its last benign version.
# Metadata and hashes only. See README.md and .claude/rules/samples.md.
#
# provenance_present is n for anything before npm provenance launched on 2023-04-19
# (https://github.blog/security/supply-chain-security/introducing-npm-package-provenance/),
# unset where no source establishes it, and otherwise as the cited sources state.
# incident_date is the malicious version's registry publish date unless a note says otherwise.
# DataDog dataset manifest checked: https://github.com/DataDog/malicious-software-packages-dataset
