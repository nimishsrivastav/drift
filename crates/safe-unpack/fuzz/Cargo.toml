[package]
name = "safe-unpack-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
safe-unpack = { path = ".." }

# Its own workspace: cargo-fuzz needs nightly and sanitizer flags that the main workspace must not inherit.
[workspace]
members = ["."]

[[bin]]
name = "unpack"
path = "fuzz_targets/unpack.rs"
test = false
doc = false
bench = false
