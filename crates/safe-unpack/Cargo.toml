thiserror.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
