[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
drift-proto = { path = "crates/drift-proto" }
prost = "0.14.4"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

# tree-sitter's C parser is slow unoptimized, which makes debug-build tests crawl on large inputs.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-javascript]
opt-level = 3

[profile.dev.package.tree-sitter-typescript]
opt-level = 3
