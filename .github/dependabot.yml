version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: gomod
    directories: [/orchestrator, /analyzers/meta-go, /gen/go]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
  - package-ecosystem: docker
    directories: [/orchestrator, /analyzers/meta-go, /crates/static-rs, /crates/trace-rs, /scorer]
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
