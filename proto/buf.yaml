version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The contract in CLAUDE.md fixes these names: Analyzer, Scorer,
    # Analyze(ArtifactPair) -> AnalyzeResponse and Score(ScoreRequest) -> DriftReport.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
